<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quanta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="containerTasas" class="mb-3">
            <input type="number" class="form-control mb-2" name="tasaBCV" id="inputBCV" placeholder="Tasa BCV">
            <input type="number" class="form-control" name="tasaParalelo" id="inputParalelo" placeholder="Tasa Paralelo">
        </div>

        <div id="containerCapitalGanancia">
            <div id="containerCapital" class="mb-3">
                <input type="number" class="form-control mb-2" name="capital" id="inputCapital" placeholder="Capital a convertir">
                <button id="btnCalcular" class="btn w-100">Calcular</button>
            </div>
            <div id="containerGanancia">
                <p>Ganancia Bruta en BS: <span id="gananciaBruta" title="Ganacia Bruta en Bs"></span></p>
                <p>Ganancia Bruta en $: <span id="gananciaBrutaConvertida" title="Ganacia Bruta en $"></span></p>
                <p>Ganancia Neta en BS: <span id="gananciaNeta" title="Ganacia Neta en Bs"></span></p>
                <p>Ganancia Neta en $: <span id="gananciaNetaConvertida" title="Ganacia Neta en $"></span></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
